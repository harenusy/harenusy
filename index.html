<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨佳兴 | GitHub主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        .card-hover {
            transition: all 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 主内容区 -->
    <main class="max-w-3xl mx-auto px-6 py-16">

        <!-- 个人信息 -->
        <section class="text-center mb-20">
            <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gray-200 flex items-center justify-center">
                <span class="text-3xl text-gray-400">👤</span>
            </div>
            <h1 class="text-3xl font-semibold mb-2">杨佳兴</h1>
            <p class="text-gray-500 mb-4">计算机专业在读学生</p>
            <p class="text-gray-600 max-w-md mx-auto text-sm leading-relaxed">
                专注于编程学习与实践，对软件开发和开源社区保持兴趣，正在逐步积累项目经验。
            </p>
            <div class="mt-8 flex justify-center gap-4">
                <a href="https://github.com/harenusy" target="_blank" 
                   class="px-5 py-2 bg-gray-900 text-white text-sm rounded-md hover:bg-gray-700 transition">
                    GitHub
                </a>
                <a href="mailto:your_email@example.com" 
                   class="px-5 py-2 border border-gray-300 text-sm rounded-md hover:border-gray-500 transition">
                    联系邮箱
                </a>
            </div>
        </section>

        <!-- 技术栈 -->
        <section class="mb-20">
            <h2 class="text-lg font-medium mb-4 pb-2 border-b border-gray-200">技术栈</h2>
            <div class="flex flex-wrap gap-2">
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">C / C++</span>
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">Python</span>
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">HTML / CSS</span>
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">JavaScript</span>
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">Linux</span>
                <span class="px-3 py-1 bg-white border border-gray-200 rounded text-sm text-gray-600">Git</span>
            </div>
        </section>

        <!-- 项目 -->
        <section class="mb-20">
            <h2 class="text-lg font-medium mb-4 pb-2 border-b border-gray-200">项目</h2>
            <div class="grid gap-4">
                <div class="card-hover bg-white p-5 rounded-lg border border-gray-100">
                    <h3 class="font-medium mb-2">课程作业项目</h3>
                    <p class="text-gray-500 text-sm">在校期间完成的课程设计与实验项目，包含数据结构、算法实现等内容。</p>
                </div>
                <div class="card-hover bg-white p-5 rounded-lg border border-gray-100">
                    <h3 class="font-medium mb-2">个人练习仓库</h3>
                    <p class="text-gray-500 text-sm">日常学习的代码记录、技术笔记和小工具练习。</p>
                </div>
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="text-center text-gray-400 text-xs pt-8 border-t border-gray-200">
            <p>© 2026 杨佳兴</p>
        </footer>

    </main>

</body>
</html>
